# CelebA 64x64 Unconditional Training
# python train.py --config configs/celeba64.yaml
# Note: CelebA may require manual download. See data/datasets.py for notes.

model:
  image_size: 64
  in_channels: 3
  base_channels: 128
  channel_mults: [1, 2, 3, 4]
  num_res_blocks: 2
  attn_resolutions: [16, 8]
  dropout: 0.1
  use_msrf: true

diffusion:
  timesteps: 1000
  schedule: cosine
  loss_type: l2

data:
  dataset: celeba
  root: ./data
  num_classes: 0
  num_workers: 4
  augment: true

training:
  epochs: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.9999
  warmup_epochs: 5
  cfg_dropout_prob: 0.0
  seed: 42
  output_dir: outputs/celeba64

sampling:
  ddim_steps: 50
  cfg_scale: 1.0
  eta: 0.0
  null_class: null

logging:
  use_wandb: false
  use_tensorboard: true
  log_every: 100
  sample_every: 2000
  save_every_epochs: 5
