# CIFAR-10 Class-Conditional Training with Classifier-Free Guidance
# python train.py --config configs/cifar10_cond.yaml

model:
  image_size: 32
  in_channels: 3
  base_channels: 128
  channel_mults: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16, 8]
  dropout: 0.1
  use_msrf: true

diffusion:
  timesteps: 1000
  schedule: cosine
  loss_type: l2

data:
  dataset: cifar10
  root: ./data
  num_classes: 10         # 10 CIFAR-10 classes
  num_workers: 4
  augment: true

training:
  epochs: 500
  batch_size: 128
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.9999
  warmup_epochs: 5
  cfg_dropout_prob: 0.10  # Drop class label 10% of the time (CFG training)
  seed: 42
  output_dir: outputs/cifar10_cond

sampling:
  ddim_steps: 50
  cfg_scale: 3.0          # w=3 gives good quality/diversity tradeoff
  eta: 0.0                # Deterministic DDIM
  null_class: 10          # num_classes = null class index

logging:
  use_wandb: false
  use_tensorboard: true
  log_every: 100
  sample_every: 5000
  save_every_epochs: 10
