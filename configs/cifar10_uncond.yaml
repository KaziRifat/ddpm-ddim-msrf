# CIFAR-10 Unconditional Training Config
# Quick start: python train.py --config configs/cifar10_uncond.yaml
# Expected ~2-3 days on a single GPU for good results; 4-6 hours for decent samples.

model:
  image_size: 32
  in_channels: 3
  base_channels: 128
  channel_mults: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16, 8]
  dropout: 0.1
  use_msrf: true          # ★ Toggle to false to disable architectural twist

diffusion:
  timesteps: 1000
  schedule: cosine        # cosine | linear | quadratic
  loss_type: l2           # l2 | l1 | huber

data:
  dataset: cifar10        # cifar10 | cifar100 | celeba | tiny_imagenet | <path>
  root: ./data
  num_classes: 0          # 0 = unconditional
  num_workers: 4
  augment: true

training:
  epochs: 500
  batch_size: 128
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.9999
  warmup_epochs: 5
  cfg_dropout_prob: 0.0   # No CFG for unconditional
  seed: 42
  output_dir: outputs/cifar10_uncond

sampling:
  ddim_steps: 50
  cfg_scale: 1.0
  eta: 0.0
  null_class: null

logging:
  use_wandb: false
  use_tensorboard: true
  log_every: 100
  sample_every: 5000
  save_every_epochs: 10
