# Tiny debug config - runs in minutes on CPU/MPS
# python train.py --config configs/debug.yaml
# Use this to verify everything works before a full run.

model:
  image_size: 32
  in_channels: 3
  base_channels: 32        # Very small model
  channel_mults: [1, 2, 2]
  num_res_blocks: 1
  attn_resolutions: [8]
  dropout: 0.0
  use_msrf: true

diffusion:
  timesteps: 200           # Short schedule for fast iteration
  schedule: cosine
  loss_type: l2

data:
  dataset: cifar10
  root: ./data
  num_classes: 10
  num_workers: 0           # 0 for debug (avoids multiprocessing issues)
  augment: false

training:
  epochs: 3
  batch_size: 16
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.999
  warmup_epochs: 1
  cfg_dropout_prob: 0.1
  seed: 0
  output_dir: outputs/debug

sampling:
  ddim_steps: 10
  cfg_scale: 3.0
  eta: 0.0
  null_class: 10

logging:
  use_wandb: false
  use_tensorboard: false
  log_every: 10
  sample_every: 50
  save_every_epochs: 1
